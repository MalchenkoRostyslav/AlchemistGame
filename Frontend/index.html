<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Алхімік</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages/brew.css">
  <link rel="stylesheet" href="styles/pages/market.css">
  <link rel="stylesheet" href="styles/pages/skills.css">
</head>
<body>
  <div id="fx" class="fx"></div>

  <!-- ГОЛОВНЕ МЕНЮ -->
  <div id="screen-menu" class="screen menu-screen">
    <div class="menu-card panel">
      <div class="logo-flask">⚗</div>
      <h1 class="logo">Алхімік</h1>
      <p class="subtitle">Лабораторія зілля</p>

      <div id="menu-main" class="stack">
        <button id="btn-new" class="btn btn-brass btn-lg">Нова гра</button>
        <button id="btn-load" class="btn btn-green btn-lg">Продовжити</button>
        <button id="btn-delete" class="btn btn-ghost">Видалити профіль</button>
      </div>

      <div id="menu-new" class="stack hidden">
        <h3 class="section-title">Ім'я алхіміка</h3>
        <input id="nickname-input" class="input" type="text" maxlength="50" placeholder="Наприклад: Мерлін" autocomplete="off">
        <p id="new-error" class="form-error"></p>
        <button id="btn-create" class="btn btn-brass btn-lg">Почати гру</button>
        <button class="btn btn-ghost" data-back>Назад</button>
      </div>

      <div id="menu-load" class="stack hidden">
        <h3 id="list-title" class="section-title">Оберіть профіль</h3>
        <div id="profiles-list" class="stack scroll-list"></div>
        <button class="btn btn-ghost" data-back>Назад</button>
      </div>
    </div>
  </div>

  <!-- ГРА -->
  <div id="screen-game" class="screen game-screen hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-ico">⚗</span> Алхімік</div>

      <nav class="nav">
        <a class="nav-link" data-page="brew"   href="#/brew">🜄 Котел</a>
        <a class="nav-link" data-page="shop"   href="#/shop">🪙 Магазин</a>
        <a class="nav-link" data-page="quests" href="#/quests">📜 Квести</a>
        <a class="nav-link" data-page="skills" href="#/skills">✦ Прокачка</a>
      </nav>

      <div class="hud">
        <div class="hud-badge gold" title="Золото">🪙 <b id="hud-gold">0</b></div>
        <div class="hud-badge energy" title="Енергія">⚡ <b id="hud-energy">0/0</b><small id="hud-energy-timer"></small></div>
        <div class="hud-level" title="Рівень і досвід">
          <span class="lvl">Рів. <b id="hud-level">1</b></span>
          <div class="bar"><div id="hud-xp-fill" class="bar-fill"></div></div>
          <small id="hud-xp-text"></small>
        </div>
        <a id="hud-sp" class="hud-badge sp hidden" href="#/skills" title="Очки навичок">✦ 0</a>
        <button id="btn-exit" class="btn btn-ghost btn-sm">Вийти</button>
      </div>
    </header>

    <main id="view" class="view"></main>
  </div>

  <div id="toasts" class="toasts"></div>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
